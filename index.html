</section>
</div>

const $=id=>document.getElementById(id);
let index=0,answers=[],name="",academic="";

function render(){
 const item=QUESTIONS[index];
 $("qCounter").textContent=`السؤال ${index+1} من ${QUESTIONS.length}`;
 $("bar").style.width=((index+1)/QUESTIONS.length*100)+"%";
 $("studentInfo").textContent=name+" — "+academic;
 $("question").textContent=item.q;
 const box=$("options");box.innerHTML="";
 item.opts.forEach((opt,i)=>{
   const b=document.createElement("button");
   b.className="option";b.textContent=opt;b.onclick=()=>choose(i);box.appendChild(b);
 });
 $("feedback").className="feedback hidden";$("feedback").innerHTML="";
 $("prevBtn").disabled=index===0;$("nextBtn").disabled=answers[index]===null;
}

function choose(i){
 if(answers[index]!==null)return;
 answers[index]=i;const item=QUESTIONS[index];
 document.querySelectorAll(".option").forEach((b,j)=>{
   b.disabled=true;
   if(j===item.a)b.classList.add("correct");
   if(j===i && i!==item.a)b.classList.add("wrong");
 });
 const f=$("feedback");
 f.className="feedback "+(i===item.a?"good":"bad");
 f.innerHTML=(i===item.a?"<strong>✓ إجابة صحيحة</strong><br>":"<strong>✗ إجابة غير صحيحة</strong><br>")+item.fb;
 $("nextBtn").disabled=false;
}

function finish(){
 let score=0;answers.forEach((a,i)=>{if(a===QUESTIONS[i].a)score++;});
 const pct=Math.round(score/QUESTIONS.length*100);
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 $("resultStudent").textContent=`الطالبة: ${name} — الرقم الأكاديمي: ${academic}`;
 $("score").textContent=`${score} / ${QUESTIONS.length} — ${pct}%`;
 $("message").textContent=pct>=90?"أداء ممتاز جدًا.":pct>=75?"أداء جيد جدًا.":pct>=60?"أداء جيد، مع الحاجة لمراجعة بعض النقاط.":"تحتاجين إلى مراجعة المادة والمحاولة مرة أخرى.";
}

function buildReview(){
 const r=$("review");r.innerHTML="<h2>مراجعة الإجابات</h2>";
 QUESTIONS.forEach((item,i)=>{
   const d=document.createElement("div");d.className="review-item";
   const chosen=answers[i]===null?"لم تتم الإجابة":item.opts[answers[i]];
   d.innerHTML=`<b>${i+1}. ${item.q}</b><div>إجابتك: ${chosen}</div><div>الإجابة الصحيحة: <strong>${item.opts[item.a]}</strong></div><div class="small">${item.fb}</div>`;
   r.appendChild(d);
 });
}

$("startBtn").onclick=()=>{
 name=$("studentName").value.trim();academic=$("academicNo").value.trim();
 if(!name||!academic){alert("من فضلك أدخلي اسم الطالبة والرقم الأكاديمي قبل البدء.");return;}
 index=0;answers=Array(QUESTIONS.length).fill(null);
 $("start").classList.add("hidden");$("quiz").classList.remove("hidden");render();
};
$("nextBtn").onclick=()=>{if(index<QUESTIONS.length-1){index++;render();}else finish();};
$("prevBtn").onclick=()=>{if(index>0){index--;render();}};
$("reviewBtn").onclick=()=>{buildReview();$("review").classList.toggle("hidden");};
$("restartBtn").onclick=()=>location.reload();
</script>
